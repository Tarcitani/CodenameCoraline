plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 26.1.2 ships Java 25 to end users, so the mod targets Java 25.
// Gradle provisions the toolchain via foojay-resolver (see settings.gradle) when it is not installed locally.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Existing cache unit tests already use Jupiter; none of these dependencies ship in the mod jar.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test).configure { useJUnitPlatform() }

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        basiliskTest {
            type = 'gameTestServer'
            gameDirectory = file('build/basilisk-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.basiliskTests', 'true'
        }
        lithophageTest {
            type = 'gameTestServer'
            gameDirectory = file('build/lithophage-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.lithophageTests', 'true'
        }
        lastGiftCollectorTest {
            type = 'gameTestServer'
            gameDirectory = file('build/collector-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.collectorTests', 'true'
        }
        canopyBreakerTest {
            type = 'gameTestServer'
            gameDirectory = file('build/canopy-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.canopyTests', 'true'
        }
        deadrootClubTest {
            type = 'gameTestServer'
            gameDirectory = file('build/deadroot-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.deadrootTests', 'true'
        }
        crimsonCommanderTest {
            type = 'gameTestServer'
            gameDirectory = file('build/crimson-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.crimsonTests', 'true'
        }
        tenThreadsWitchTest {
            type = 'gameTestServer'
            gameDirectory = file('build/ten-threads-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.tenThreadsTests', 'true'
        }
        matriarchAnimationTest {
            type = 'gameTestServer'
            gameDirectory = file('build/matriarch-animation-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.matriarchAnimTests', 'true'
        }
        feyRavenTest {
            type = 'gameTestServer'
            gameDirectory = file('build/fey-raven-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.feyRavenTests', 'true'
        }
        brimstoneSalamanderTest {
            type = 'gameTestServer'
            gameDirectory = file('build/brimstone-salamander-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.brimstoneSalamanderTests', 'true'
        }
        architectTest {
            type = 'gameTestServer'
            gameDirectory = file('build/architect-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'coraline.architectTests', 'true'
        }
        // Applies to all run configurations above.
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the properties declared in gradle.properties into src/main/templates (neoforge.mods.toml).
// A missing property fails the build. Placeholders use ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
