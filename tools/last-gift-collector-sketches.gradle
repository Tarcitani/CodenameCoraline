// Optional asset tooling for Last Gift Collector bestiary plates; does not participate in normal builds.
allprojects {
    afterEvaluate {
        def exporterClasses = layout.buildDirectory.dir('last-gift-collector-sketches/classes')
        def compileExporter = tasks.register('compileLastGiftCollectorSketchExporter', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('tools/ExportLastGiftCollectorModel.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = exporterClasses
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            options.encoding = 'UTF-8'
        }
        tasks.register('exportLastGiftCollectorSketchModel', JavaExec) {
            dependsOn compileExporter
            classpath = sourceSets.main.runtimeClasspath + files(exporterClasses)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            mainClass = 'ExportLastGiftCollectorModel'
            args layout.buildDirectory.file('last-gift-collector-sketches/model.json').get().asFile.absolutePath
        }
    }
}

