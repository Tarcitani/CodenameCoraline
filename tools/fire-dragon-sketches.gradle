// Optional asset tooling for Fire Dragon visual pose review and Bestiary plates.
allprojects {
    afterEvaluate {
        def exporterClasses = layout.buildDirectory.dir('fire-dragon-sketches/classes')
        def compileExporter = tasks.register('compileFireDragonSketchExporter', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('tools/ExportFireDragonModel.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = exporterClasses
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            options.encoding = 'UTF-8'
        }
        tasks.register('exportFireDragonSketchModel', JavaExec) {
            dependsOn compileExporter
            classpath = sourceSets.main.runtimeClasspath + files(exporterClasses)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            mainClass = 'ExportFireDragonModel'
            args layout.buildDirectory.file('fire-dragon-sketches/model.json').get().asFile.absolutePath
        }
    }
}
