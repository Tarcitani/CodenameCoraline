// Optional asset tooling for BabyDragon bestiary plates; does not participate in normal builds.
allprojects {
    afterEvaluate {
        def exporterClasses = layout.buildDirectory.dir('baby-dragon-sketches/classes')
        def compileExporter = tasks.register('compileBabyDragonSketchExporter', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('tools/ExportBabyDragonModel.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = exporterClasses
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            options.encoding = 'UTF-8'
        }
        tasks.register('exportBabyDragonSketchModel', JavaExec) {
            dependsOn compileExporter
            classpath = sourceSets.main.runtimeClasspath + files(exporterClasses)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            mainClass = 'ExportBabyDragonModel'
            args layout.buildDirectory.file('baby-dragon-sketches/model.json').get().asFile.absolutePath
        }
    }
}
