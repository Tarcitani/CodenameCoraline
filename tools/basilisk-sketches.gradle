// Optional asset tooling; does not participate in normal builds or game runs.
allprojects {
    afterEvaluate {
        def exporterClasses = layout.buildDirectory.dir('basilisk-sketches/classes')
        def compileExporter = tasks.register('compileBasiliskSketchExporter', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('tools/ExportBasiliskModel.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = exporterClasses
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            options.encoding = 'UTF-8'
        }
        tasks.register('exportBasiliskSketchModel', JavaExec) {
            dependsOn compileExporter
            classpath = sourceSets.main.runtimeClasspath + files(exporterClasses)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            mainClass = 'ExportBasiliskModel'
            args layout.buildDirectory.file('basilisk-sketches/model.json').get().asFile.absolutePath
        }
    }
}
