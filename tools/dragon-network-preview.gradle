// Isolated loopback server and owner client for two-client visual verification.
allprojects {
    afterEvaluate {
        neoForge.runs.create('dragonNetworkServer') {
            server()
            gameDirectory = file('build/dragon-network-preview')
            programArgument '--nogui'
        }
        neoForge.runs.create('dragonNetworkOwner') {
            client()
            gameDirectory = file('build/dragon-evolution-preview')
            programArguments.addAll('--username', 'Dev', '--quickPlayMultiplayer', '127.0.0.1:25565')
        }
    }
}
