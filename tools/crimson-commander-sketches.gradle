// Optional asset tooling for Crimson Commander bestiary plates; does not participate in normal builds.
allprojects {
    afterEvaluate {
        def exporterClasses = layout.buildDirectory.dir('crimson-commander-sketches/classes')
        def compileExporter = tasks.register('compileCrimsonCommanderSketchExporter', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('tools/ExportCrimsonCommanderModel.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = exporterClasses
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            options.encoding = 'UTF-8'
        }
        tasks.register('exportCrimsonCommanderSketchModel', JavaExec) {
            dependsOn compileExporter
            classpath = sourceSets.main.runtimeClasspath + files(exporterClasses)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            mainClass = 'ExportCrimsonCommanderModel'
            args layout.buildDirectory.file('crimson-commander-sketches/model.json').get().asFile.absolutePath
        }
    }
}
