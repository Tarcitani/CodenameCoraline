// Optional asset tooling for Fey Raven visual pose review and Bestiary plates.
allprojects {
    afterEvaluate {
        def exporterClasses = layout.buildDirectory.dir('fey-raven-sketches/classes')
        def compileExporter = tasks.register('compileFeyRavenSketchExporter', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('tools/ExportFeyRavenModel.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = exporterClasses
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            options.encoding = 'UTF-8'
        }
        tasks.register('exportFeyRavenSketchModel', JavaExec) {
            dependsOn compileExporter
            classpath = sourceSets.main.runtimeClasspath + files(exporterClasses)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            mainClass = 'ExportFeyRavenModel'
            args layout.buildDirectory.file('fey-raven-sketches/model.json').get().asFile.absolutePath
        }
    }
}

