// Optional asset tooling for Canopy Breaker bestiary plates; does not participate in normal builds.
allprojects {
    afterEvaluate {
        def exporterClasses = layout.buildDirectory.dir('canopy-breaker-sketches/classes')
        def compileExporter = tasks.register('compileCanopyBreakerSketchExporter', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('tools/ExportCanopyBreakerModel.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = exporterClasses
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            options.encoding = 'UTF-8'
        }
        tasks.register('exportCanopyBreakerSketchModel', JavaExec) {
            dependsOn compileExporter
            classpath = sourceSets.main.runtimeClasspath + files(exporterClasses)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            mainClass = 'ExportCanopyBreakerModel'
            args layout.buildDirectory.file('canopy-breaker-sketches/model.json').get().asFile.absolutePath
        }
    }
}
