// Optional asset tooling for Soul Reaper visual pose review and Bestiary plates.
allprojects {
    afterEvaluate {
        def exporterClasses = layout.buildDirectory.dir('soul-reaper-sketches/classes')
        def compileExporter = tasks.register('compileSoulReaperSketchExporter', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('tools/ExportSoulReaperModel.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = exporterClasses
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            options.encoding = 'UTF-8'
        }
        tasks.register('exportSoulReaperSketchModel', JavaExec) {
            dependsOn compileExporter
            classpath = sourceSets.main.runtimeClasspath + files(exporterClasses)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            mainClass = 'ExportSoulReaperModel'
            args layout.buildDirectory.file('soul-reaper-sketches/model.json').get().asFile.absolutePath
        }
    }
}

