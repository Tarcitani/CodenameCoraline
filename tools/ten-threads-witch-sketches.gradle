// Optional asset tooling for the Witch of Ten Threads bestiary plates; does not participate in normal builds.
allprojects {
    afterEvaluate {
        def exporterClasses = layout.buildDirectory.dir('ten-threads-sketches/classes')
        def compileExporter = tasks.register('compileTenThreadsSketchExporter', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('tools/ExportTenThreadsWitchModel.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = exporterClasses
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            options.encoding = 'UTF-8'
        }
        tasks.register('exportTenThreadsSketchModel', JavaExec) {
            dependsOn compileExporter
            classpath = sourceSets.main.runtimeClasspath + files(exporterClasses)
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            mainClass = 'ExportTenThreadsWitchModel'
            args layout.buildDirectory.file('ten-threads-sketches/model.json').get().asFile.absolutePath
        }
    }
}
